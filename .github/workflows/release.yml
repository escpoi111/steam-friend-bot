name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SteamFriendBot --clean steam_friend_bot_gui.py

      - name: Prepare release files
        run: |
          mkdir release
          copy dist\SteamFriendBot.exe release\
          copy .env.example release\
          copy friend_codes.txt.example release\
          copy exclude_list.txt.example release\
          copy README.md release\
        shell: cmd

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path release\* -DestinationPath SteamFriendBot-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamFriendBot
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SteamFriendBot-${{ github.ref_name }}.zip
            dist/SteamFriendBot.exe
          generate_release_notes: true
          draft: false
          prerelease: false
