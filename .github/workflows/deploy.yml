name: Test and Deploy

on:
  push:
    branches: ["main"]

jobs:
  # --------------------------------------------------------------------------
  # 1. 运行 pytest
  # --------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  # --------------------------------------------------------------------------
  # 2. 仅在测试通过后部署到服务器，失败则自动回滚
  # --------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ needs.test.result == 'success' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/current"

      - name: Deploy + HealthCheck + Rollback
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" << 'ENDSSH'
            set -euo pipefail

            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            CURRENT_DIR="$APP_DIR/current"
            BACKUP_DIR="$APP_DIR/backup_$(date +%Y%m%d%H%M%S)"
            HEALTH_URL="http://127.0.0.1:8080/healthz"

            mkdir -p "$APP_DIR"

            # 备份当前版本（若存在且非空）
            if [ -d "$CURRENT_DIR" ] && [ "$(ls -A "$CURRENT_DIR" 2>/dev/null || true)" ]; then
              cp -a "$CURRENT_DIR" "$BACKUP_DIR"
              echo "Backup created: $BACKUP_DIR"
            fi

            cd "$CURRENT_DIR"

            # 部署新版本
            docker compose down || true
            docker compose up -d --build

            # 健康检查（最多 18 次，约 90 秒）
            ok=0
            for i in $(seq 1 18); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                ok=1
                break
              fi
              echo "Health check retry $i/18..."
              sleep 5
            done

            if [ "$ok" -eq 1 ]; then
              echo "Deploy success."
              docker image prune -f
              exit 0
            fi

            # 健康检查失败：回滚
            echo "Health check failed. Rolling back..."
            if [ -d "$BACKUP_DIR" ]; then
              docker compose down || true
              rm -rf "$CURRENT_DIR"
              cp -a "$BACKUP_DIR" "$CURRENT_DIR"
              cd "$CURRENT_DIR"
              docker compose up -d --build

              # 回滚后再检查一次
              for i in $(seq 1 12); do
                if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                  echo "Rollback success."
                  exit 0
                fi
                sleep 5
              done
              echo "Rollback health check also failed, manual intervention required."
            else
              echo "No backup found, manual intervention required."
            fi
            exit 1
          ENDSSH
