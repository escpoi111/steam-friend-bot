version: "3.9"

services:
  steam-friend-bot:
    build: .
    container_name: steam-friend-bot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - NOVICE_MODE=true
    volumes:
      - ./config:/app/config
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
